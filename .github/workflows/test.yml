name: Referee regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check.mjs
      - run: node --test scripts/relay-client.test.mjs scripts/arena-score.test.mjs scripts/review.test.mjs scripts/review-psychology.test.mjs
      - name: Install isolated browser test dependencies
        run: npm ci
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Review and leaderboard browser regression
        run: node scripts/review-browser.test.mjs
      - run: node --test --test-concurrency=1 v2/tests/*.test.mjs
